<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prompteur</title>

  <style>
    :root{
      --bg:#000;
      --fg:#cfcfcf;
      --fgSoft:#b8b8b8;
      --border:#2a2a2a;
      --accent:#7a7a7a;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--fg);
    }

    .app{
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    .controls{
      background:rgba(17,17,17,.96);
      border-bottom:1px solid var(--border);
      padding:14px;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      align-items:flex-end;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:220px;
    }

    label{
      font-size:14px;
      color:#bdbdbd;
    }

    textarea{
      width:420px;
      max-width:92vw;
      height:150px;
      background:#0a0a0a;
      color:var(--fg);
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      resize:vertical;
      outline:none;
      font-size:17px;
    }

    button{
      background:#1a1a1a;
      color:var(--fg);
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px 20px;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      font-size:18px;
      font-weight:600;
      min-height:56px;
    }

    button.primary{background:#232323;border-color:#444}
    button.danger{background:#1a1111;border-color:#4a2a2a}
    button.good{background:#132013;border-color:#2a4a2a}

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .toggle{
      display:inline-flex;
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
    }

    .toggle button{
      border:0;
      border-right:1px solid var(--border);
      border-radius:0;
      background:#151515;
      padding:16px 20px;
      font-size:17px;
      min-height:56px;
    }

    .toggle button:last-child{border-right:0}
    .toggle button.active{background:#2a2a2a}

    .sliderWrap{
      width:360px;
      max-width:92vw;
      background:#0a0a0a;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
    }

    input[type="range"]{
      width:100%;
      accent-color:var(--accent);
    }

    input[type="number"]{
      width:78px;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#0a0a0a;
      color:var(--fg);
      font-size:16px;
    }

    .meta{
      font-size:13px;
      color:#bdbdbd;
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin:6px 0;
    }

    .stageWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:14px;
    }

    .stage{
      position:relative;
      background:#000;
      border:1px solid #111;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 0 0 1px #0a0a0a inset;
    }

    .stage.portrait{
      width:min(92vw,560px);
      height:min(80vh,980px);
    }

    .stage.landscape{
      width:min(92vw,1100px);
      height:min(66vh,560px);
    }

    .viewport{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    .content{
      position:absolute;
      left:0;
      top:0;
      width:100%;
      padding:0 var(--pad);
      transform-origin:center;
      will-change:top;
      white-space:pre-wrap;
      text-align:left;
      line-height:var(--lh);
      font-size:var(--fs);
      color:var(--textColor);
    }

    .mirror .content{
      transform:scaleX(-1);
    }

    .hud{
      position:absolute;
      left:12px;
      bottom:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      font-size:13px;
      color:#c8c8c8;
      z-index:5;
    }

    .pill{
      background:rgba(0,0,0,.6);
      border:1px solid #1a1a1a;
      padding:7px 10px;
      border-radius:999px;
    }

    .hint{
      position:absolute;
      right:12px;
      bottom:12px;
      font-size:12px;
      color:#8a8a8a;
      background:rgba(0,0,0,.55);
      padding:7px 10px;
      border:1px solid #1a1a1a;
      border-radius:10px;
      max-width:70%;
      text-align:right;
      z-index:5;
    }

    .overlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.55);
      z-index:10;
    }

    .overlay.show{display:flex}

    .countNum{
      font-size:clamp(64px,12vw,160px);
      font-weight:700;
      color:#e0e0e0;
    }

    :fullscreen .controls{display:none}

    .app.kiosk .controls{display:none}

    .app.kiosk{
      height:100vh;
      overflow:hidden;
    }

    .app.kiosk .stageWrap{
      padding:0;
    }

    .app.kiosk .stage{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      border-radius:0;
      border:0;
    }
  </style>
</head>

<body>
<div id="app" class="app">

  <div class="controls">

    <div class="group">
      <label for="text">Ton texte</label>
      <textarea id="text" placeholder="Colle ton texte ici…"></textarea>
    </div>

    <div class="group">
      <label>Vitesse</label>
      <div class="sliderWrap">
        <div class="meta">
          <span id="speedLabel">Vitesse : 5</span>
          <span id="pxLabel">≈ 0 px/s</span>
        </div>
        <input id="speed" type="range" min="1" max="12" step="1" value="5">
      </div>
    </div>

    <div class="group">
      <label>Texte</label>
      <div class="sliderWrap">
        <div class="meta"><span>Taille</span><span id="fsLabel">40px</span></div>
        <input id="fontSize" type="range" min="18" max="90" step="1" value="40">

        <div class="meta"><span>Interligne</span><span id="lhLabel">1.35</span></div>
        <input id="lineHeight" type="range" min="1.05" max="1.80" step="0.05" value="1.35">

        <div class="meta"><span>Marge</span><span id="padLabel">48px</span></div>
        <input id="padding" type="range" min="12" max="120" step="2" value="48">
      </div>
    </div>

    <div class="group">
      <label>Affichage</label>
      <div class="row">
        <div class="toggle">
          <button id="btnPortrait" class="active" type="button">Portrait</button>
          <button id="btnLandscape" type="button">Paysage</button>
        </div>

        <div class="toggle">
          <button id="btnMirrorOn" class="active" type="button">Miroir ON</button>
          <button id="btnMirrorOff" type="button">Miroir OFF</button>
        </div>

        <div class="toggle">
          <button id="btnSoftOn" class="active" type="button">Doux</button>
          <button id="btnSoftOff" type="button">Normal</button>
        </div>
      </div>
    </div>

    <div class="group">
      <label>Départ & options</label>
      <div class="row">
        <div class="toggle">
          <button id="btnStartBottom" class="active" type="button">En bas</button>
          <button id="btnStartTop" type="button">Au début</button>
        </div>
      </div>

      <div class="row">
        <label>
          <input id="chkLoop" type="checkbox">
          Mode boucle
        </label>

        <label>
          <input id="chkCountdown" type="checkbox" checked>
          Compte à rebours
        </label>

        <span>Durée :</span>
        <input id="countdownSec" type="number" min="1" max="10" value="3">
        <span>s</span>
      </div>
    </div>

    <div class="group">
      <label>Contrôles</label>
      <div class="row">
        <button id="btnStart" class="primary" type="button">▶ Lancer</button>
        <button id="btnPause" type="button">⏸ Pause</button>
        <button id="btnStop" class="danger" type="button">⏹ Stop</button>
        <button id="btnFullscreen" class="good" type="button">⛶ Plein écran</button>
      </div>
    </div>

  </div>

  <div class="stageWrap">
    <div id="stage" class="stage portrait mirror"
         style="--fs:40px;--lh:1.35;--pad:48px;--textColor:var(--fgSoft);">

      <div class="viewport">
        <div id="content" class="content"></div>
      </div>

      <div id="overlay" class="overlay">
        <div id="countNum" class="countNum">3</div>
      </div>

      <div class="hud">
        <span class="pill" id="statePill">⏹ Stop</span>
        <span class="pill" id="infoPill">0 px/s</span>
      </div>

      <div class="hint">
        Espace = Pause/Reprendre<br>
        Ctrl/Cmd + Entrée = Lancer
      </div>

    </div>
  </div>

</div>

<script>
const app = document.getElementById('app');
const elText = document.getElementById('text');
const elSpeed = document.getElementById('speed');
const elSpeedLabel = document.getElementById('speedLabel');
const elPxLabel = document.getElementById('pxLabel');

const elFontSize = document.getElementById('fontSize');
const elLineHeight = document.getElementById('lineHeight');
const elPadding = document.getElementById('padding');

const fsLabel = document.getElementById('fsLabel');
const lhLabel = document.getElementById('lhLabel');
const padLabel = document.getElementById('padLabel');

const stage = document.getElementById('stage');
const content = document.getElementById('content');

const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');
const btnStop = document.getElementById('btnStop');
const btnFullscreen = document.getElementById('btnFullscreen');

const btnPortrait = document.getElementById('btnPortrait');
const btnLandscape = document.getElementById('btnLandscape');
const btnMirrorOn = document.getElementById('btnMirrorOn');
const btnMirrorOff = document.getElementById('btnMirrorOff');
const btnSoftOn = document.getElementById('btnSoftOn');
const btnSoftOff = document.getElementById('btnSoftOff');
const btnStartBottom = document.getElementById('btnStartBottom');
const btnStartTop = document.getElementById('btnStartTop');

const chkLoop = document.getElementById('chkLoop');
const chkCountdown = document.getElementById('chkCountdown');
const countdownSec = document.getElementById('countdownSec');

const overlay = document.getElementById('overlay');
const countNum = document.getElementById('countNum');

const statePill = document.getElementById('statePill');
const infoPill = document.getElementById('infoPill');

let running = false;
let paused = false;
let y = 0;
let lastTs = null;
let startMode = 'bottom';
let softContrast = true;
let countdownTimer = null;
let inCountdown = false;

function speedPxPerSecond(){
  const v = Number(elSpeed.value);
  return 2 + Math.pow(v, 1.45) * 3.2;
}

function viewportHeight(){
  return stage.clientHeight;
}

function contentHeight(){
  return content.scrollHeight;
}

function endY(){
  return -contentHeight() - 80;
}

function updateHUD(){
  const px = Math.round(speedPxPerSecond());
  elSpeedLabel.textContent = `Vitesse : ${elSpeed.value}`;
  elPxLabel.textContent = `≈ ${px} px/s`;
  infoPill.textContent = `${px} px/s`;

  if(inCountdown) statePill.textContent = '⏳ Départ…';
  else if(!running) statePill.textContent = '⏹ Stop';
  else if(paused) statePill.textContent = '⏸ Pause';
  else statePill.textContent = '▶ Lecture';
}

function applyTypography(){
  stage.style.setProperty('--fs', `${elFontSize.value}px`);
  stage.style.setProperty('--lh', `${elLineHeight.value}`);
  stage.style.setProperty('--pad', `${elPadding.value}px`);

  fsLabel.textContent = `${elFontSize.value}px`;
  lhLabel.textContent = Number(elLineHeight.value).toFixed(2);
  padLabel.textContent = `${elPadding.value}px`;

  resetPosition();
}

function applyContrast(){
  stage.style.setProperty('--textColor', softContrast ? 'var(--fgSoft)' : 'var(--fg)');
  btnSoftOn.classList.toggle('active', softContrast);
  btnSoftOff.classList.toggle('active', !softContrast);
}

function setContentFromTextarea(){
  const t = elText.value.trim();
  content.textContent = t.length ? t : "Colle ton texte en haut, puis clique sur Lancer.";
  resetPosition();
}

function resetPosition(){
  y = startMode === 'bottom' ? viewportHeight() - 60 : 40;
  content.style.top = `${y}px`;
}

function loop(ts){
  if(!running){
    lastTs = null;
    return;
  }

  if(paused){
    lastTs = ts;
    requestAnimationFrame(loop);
    return;
  }

  if(lastTs === null) lastTs = ts;

  const dt = (ts - lastTs) / 1000;
  lastTs = ts;

  y -= speedPxPerSecond() * dt;
  content.style.top = `${y}px`;

  if(y <= endY()){
    if(chkLoop.checked){
      resetPosition();
      lastTs = null;
      requestAnimationFrame(loop);
    }else{
      running = false;
      paused = false;
      updateHUD();
    }
    return;
  }

  requestAnimationFrame(loop);
}

function clearCountdown(){
  if(countdownTimer){
    clearInterval(countdownTimer);
    countdownTimer = null;
  }

  inCountdown = false;
  overlay.classList.remove('show');
}

function startWithOptionalCountdown(){
  if(!elText.value.trim()) setContentFromTextarea();
  if(running && !paused) return;

  paused = false;

  const doCountdown = chkCountdown.checked;
  const sec = Math.max(1, Math.min(10, Number(countdownSec.value) || 3));

  if(doCountdown){
    clearCountdown();
    inCountdown = true;
    updateHUD();

    overlay.classList.add('show');

    let n = sec;
    countNum.textContent = n;

    countdownTimer = setInterval(() => {
      n -= 1;

      if(n <= 0){
        clearCountdown();
        running = true;
        paused = false;
        lastTs = null;
        updateHUD();
        requestAnimationFrame(loop);
      }else{
        countNum.textContent = n;
      }
    }, 1000);
  }else{
    running = true;
    paused = false;
    lastTs = null;
    updateHUD();
    requestAnimationFrame(loop);
  }
}

function togglePause(){
  if(inCountdown) return;

  if(running){
    paused = !paused;
    updateHUD();
  }else{
    startWithOptionalCountdown();
  }
}

function stop(){
  clearCountdown();
  running = false;
  paused = false;
  lastTs = null;
  resetPosition();
  updateHUD();
}

function setOrientation(mode){
  stage.classList.toggle('portrait', mode === 'portrait');
  stage.classList.toggle('landscape', mode === 'landscape');
  btnPortrait.classList.toggle('active', mode === 'portrait');
  btnLandscape.classList.toggle('active', mode === 'landscape');
  resetPosition();
}

function setMirror(on){
  stage.classList.toggle('mirror', on);
  btnMirrorOn.classList.toggle('active', on);
  btnMirrorOff.classList.toggle('active', !on);
}

function setStartMode(mode){
  startMode = mode;
  btnStartBottom.classList.toggle('active', mode === 'bottom');
  btnStartTop.classList.toggle('active', mode === 'top');
  resetPosition();
}

async function toggleFullscreen(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;

  if(stage.requestFullscreen || stage.webkitRequestFullscreen){
    try{
      if(!isFs){
        if(stage.requestFullscreen) await stage.requestFullscreen();
        else stage.webkitRequestFullscreen();
      }else{
        if(document.exitFullscreen) await document.exitFullscreen();
        else document.webkitExitFullscreen();
      }
      return;
    }catch(e){}
  }

  app.classList.toggle('kiosk');
  setTimeout(() => window.scrollTo(0,1), 50);
}

function bindFast(el, fn){
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    fn();
  }, {passive:false});

  el.addEventListener('click', e => {
    e.preventDefault();
    fn();
  });
}

elSpeed.addEventListener('input', updateHUD);
elText.addEventListener('input', setContentFromTextarea);

elFontSize.addEventListener('input', applyTypography);
elLineHeight.addEventListener('input', applyTypography);
elPadding.addEventListener('input', applyTypography);

bindFast(btnStart, startWithOptionalCountdown);
bindFast(btnPause, togglePause);
bindFast(btnStop, stop);
bindFast(btnFullscreen, toggleFullscreen);

bindFast(btnPortrait, () => setOrientation('portrait'));
bindFast(btnLandscape, () => setOrientation('landscape'));

bindFast(btnMirrorOn, () => setMirror(true));
bindFast(btnMirrorOff, () => setMirror(false));

bindFast(btnSoftOn, () => {
  softContrast = true;
  applyContrast();
});

bindFast(btnSoftOff, () => {
  softContrast = false;
  applyContrast();
});

bindFast(btnStartBottom, () => setStartMode('bottom'));
bindFast(btnStartTop, () => setStartMode('top'));

document.addEventListener('keydown', e => {
  const tag = e.target?.tagName?.toLowerCase?.() || "";
  const isTypingField = tag === "textarea" || tag === "input" || e.target?.isContentEditable;

  if(isTypingField){
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      startWithOptionalCountdown();
    }
    return;
  }

  if(e.code === 'Space'){
    e.preventDefault();
    togglePause();
  }

  if(e.key === 'Enter'){
    e.preventDefault();
    startWithOptionalCountdown();
  }

  if(e.key === 'Escape'){
    e.preventDefault();
    stop();
  }

  if(e.key.toLowerCase() === 'f'){
    e.preventDefault();
    toggleFullscreen();
  }
});

window.addEventListener('resize', resetPosition);

updateHUD();
applyTypography();
setContentFromTextarea();
setMirror(true);
setStartMode('bottom');
applyContrast();
</script>

</body>
</html>
